[package]
publish = false
name = "cerberus-mirror"
description = "Concurrent multi-window mirror groups: one master window drives N sealed-session followers of the same site, reconciled to the ≤1-live-engine invariant via a semantic action log and lazy per-focus catch-up (ADR-0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cerberus-types = { path = "../cerberus-types" }
cerberus-dom = { path = "../cerberus-dom" }
cerberus-js = { path = "../cerberus-js" }
cerberus-js-dom = { path = "../cerberus-js-dom" }
cerberus-autofill = { path = "../cerberus-autofill" }

[dev-dependencies]
cerberus-js-quickjs = { path = "../cerberus-js-quickjs" }
# Render-stack crates are test-only: they prove each mirror window paints its
# own session independently, without coupling the pure model to the paint path.
cerberus-css = { path = "../cerberus-css" }
cerberus-style = { path = "../cerberus-style" }
cerberus-layout = { path = "../cerberus-layout" }
cerberus-headless = { path = "../cerberus-headless" }
cerberus-paint = { path = "../cerberus-paint" }
