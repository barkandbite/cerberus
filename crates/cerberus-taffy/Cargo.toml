[package]
publish = false
name = "cerberus-taffy"
description = "Taffy adapter: maps ComputedStyle → taffy::Style and lays out block/flex/grid box geometry behind the LayoutEngine seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cerberus-style = { path = "../cerberus-style" }
# Modular adoption behind the LayoutEngine seam (RENDERING_ARCHITECTURE_PLAN.md,
# Stage 3): taffy owns block/flex/grid box geometry; we keep inline/text/replaced
# leaves in cerberus-layout via a measure closure. Its only transitive dep is
# arrayvec, so the footprint stays small (ADR bar for heavy deps).
taffy = { version = "0.12.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }
