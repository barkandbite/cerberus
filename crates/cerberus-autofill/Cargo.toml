[package]
publish = false
name = "cerberus-autofill"
description = "Per-identity autofill: login/address/card profiles plus heuristic form-field detection and fill planning (ADR-0022)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cerberus-dom = { path = "../cerberus-dom" }
# Wipe decrypted login/card secrets from memory on drop (ADR-0033, issue #17).
# Audited, already in the tree via cerberus-crypto.
zeroize = { version = "1", features = ["derive"] }
