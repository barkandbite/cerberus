[package]
publish = false
name = "cerberus-net"
description = "Networking traits (TlsProvider, DnsResolver, HttpClient) plus a built-in page client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cerberus-types = { path = "../cerberus-types" }
cerberus-url = { path = "../cerberus-url" }

# Pure-Rust DEFLATE/zlib inflate for gzip/deflate response bodies (ADR-0020).
# Already in the tree (transitive via the image decoder); promoted to a direct,
# wrapped dependency. No `unsafe` in the inflate path we use.
miniz_oxide = "0.8"
