name: Release

# Publishes Linux + Windows release binaries on a GitHub Release. Triggers on a
# `v*` tag push, or manually ("Run workflow" / API) with a tag input — the latter
# also creates the tag, so a release can be cut without direct tag-push rights.
# Runs only on demand, so the Actions budget is respected.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.0.1)"
        required: true
        default: v0.0.1

permissions:
  contents: write # create the tag/release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: cerberus-app
            asset: cerberus-linux-x86_64
          - os: windows-latest
            bin: cerberus-app.exe
            asset: cerberus-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned in rust-toolchain.toml (MSVC host on Windows).
      - name: Install pinned toolchain
        run: rustup show

      # Reproducible path remap (docs/REPRODUCIBLE.md); warnings are errors.
      - name: Build release binary
        run: cargo build --release --locked -p cerberus-app
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/cerberus -D warnings"

      - name: Memory gate
        run: cargo run -q -p cerberus-app --release --locked -- mem-gate --budget-mb 64 --switches 25

      - name: Benchmark gate
        run: cargo run -q -p cerberus-app --release --locked -- bench --assert-total-ms 500

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          # Create the tag at the dispatched commit, not the default branch.
          # Without this, a workflow_dispatch release from a feature branch tags
          # `main` (action-gh-release's default target_commitish), so the tag and
          # source snapshot would not match the binaries built from this commit.
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: dist/*
          fail_on_unmatched_files: true
