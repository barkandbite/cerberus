name: CI

# Manual-only: auto-runs on push/PR are disabled to respect the GitHub Actions
# budget. Trigger from the Actions tab ("Run workflow") for a full check, or run
# the same gate locally (see CONTRIBUTING.md): fmt, clippy, build, test, mem-gate.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: ${{ matrix.os }} · build · test
    strategy:
      # Run every target to completion even if one fails, so a Windows-only
      # break doesn't mask the Linux result (and vice versa).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml (incl. clippy,
      # rustfmt) for the runner's host target (windows-msvc on Windows). The
      # Windows runners ship the MSVC C toolchain that ring + bundled QuickJS
      # need, so no extra setup is required.
      - name: Install pinned toolchain
        run: rustup show

      # Format + clippy are platform-agnostic source checks — run once, on Linux.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (warnings = errors)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Build + test on every OS: this is the cross-platform port gate.
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Memory regression gate (PLAN.md "Memory budget"). RSS is read from procfs,
      # so it is Linux-only today; other platforms degrade gracefully (the gate
      # skips), so we only assert it where it is meaningful (ADR-0015).
      - name: Memory gate (idle RSS + head-switch leak check)
        if: runner.os == 'Linux'
        run: cargo run -q -p cerberus-app --release --locked -- mem-gate --budget-mb 64 --switches 25

      # Pipeline benchmark (PLAN §9 / M9). Cross-platform — a regression gate
      # against order-of-magnitude slips, not a microbench.
      - name: Benchmark gate
        run: cargo run -q -p cerberus-app --release --locked -- bench --assert-total-ms 500
